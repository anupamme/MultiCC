name: 测试失败时取消并行构建

on:
  workflow_call:

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取消当前发布工作流中的构建
        uses: actions/github-script@v7
        with:
          script: |
            // 只取消调用方本次运行，不影响其他版本、分支或工作流。
            await github.rest.actions.cancelWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
